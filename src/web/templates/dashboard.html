{% extends "base.html" %}
{% block title %}Library{% endblock %}
{% block content %}
<div class="page-stack">
  <header class="page-header page-header-row">
    <h1>Library</h1>
    <a class="header-action-btn" href="/">New capture</a>
  </header>
  <div class="storage-alert" role="status" hidden data-storage-warning>
    <span class="alert-symbol" aria-hidden="true">!</span>
    <div><strong>Low disk</strong><p data-storage-message></p></div>
  </div>
  <section class="dashboard-section admin-section" aria-labelledby="recordings-heading">
    <div class="section-heading">
      <h2 id="recordings-heading">Recordings</h2>
      <span class="section-count" data-recording-count>—</span>
    </div>
    <div class="table-wrap">
      <table class="recording-table">
        <thead><tr><th scope="col">Creator</th><th scope="col">Status</th><th scope="col">Date</th><th scope="col">Size</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead>
        <tbody data-recordings-body><tr><td colspan="5" class="empty-state">…</td></tr></tbody>
      </table>
      <div class="mobile-recordings" data-recordings-mobile></div>
    </div>
  </section>
  <section class="dashboard-section admin-section" aria-labelledby="watchlist-heading">
    <div class="section-heading">
      <h2 id="watchlist-heading">Watchlist</h2>
      <span class="section-count" data-watchlist-count>—</span>
    </div>
    <div class="watchlist-grid" data-watchlist-list><div class="empty-card">…</div></div>
  </section>
</div>
{% endblock %}
