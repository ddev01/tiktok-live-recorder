{% extends "base.html" %}
{% block title %}Capture{% endblock %}
{% block content %}
<div class="page-stack recording-page">
  <a class="back-link" href="/dashboard">← Library</a>
  <section class="recording-detail" data-recording-detail data-recording-id="{{ recording_id|default('', true) }}">
    <header class="page-header page-header-row detail-topline">
      <div class="detail-title-wrap">
        <img class="avatar" alt="" hidden data-recording-avatar>
        <div>
          <h1 data-recording-title>…</h1>
          <p class="detail-subtitle" data-recording-subtitle></p>
        </div>
      </div>
      <span class="badge status-badge admin-chip" data-recording-status>…</span>
    </header>
    <div class="detail-stats admin-section">
      <div><span class="stat-label">Elapsed</span><strong data-recording-time>—</strong></div>
      <div><span class="stat-label">Size</span><strong data-recording-size>—</strong></div>
      <div><span class="stat-label">Est.</span><strong data-recording-estimate>—</strong></div>
    </div>
    <div class="storage-alert recording-space-warning" role="status" hidden data-recording-space-warning></div>
    <section class="duration-section admin-section" aria-labelledby="duration-heading">
      <h2 id="duration-heading" class="section-title">Stop after</h2>
      <div class="duration-options" role="group" aria-label="Duration">
        <button class="btn btn-duration" type="button" data-duration="30">30s</button>
        <button class="btn btn-duration" type="button" data-duration="900">15m</button>
        <button class="btn btn-duration" type="button" data-duration="1800">30m</button>
        <button class="btn btn-duration" type="button" data-duration="3600">1h</button>
        <button class="btn btn-duration" type="button" data-duration="14400">4h</button>
        <button class="btn btn-duration" type="button" data-duration="" data-until-end">Stream end</button>
      </div>
    </section>
    <div class="detail-feedback" role="status" aria-live="polite" hidden data-detail-feedback></div>
    <div class="detail-actions">
      <a class="btn btn-primary" data-play-link href="#" hidden>Play</a>
      <a class="btn btn-outline" data-download-link href="#" hidden>Download</a>
      <button class="btn btn-danger" type="button" data-stop-recording hidden>Stop</button>
    </div>
  </section>
</div>
{% endblock %}
