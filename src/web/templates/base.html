<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Clipper{% endblock %} · Clipper</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Clipper home">
          <span class="brand-mark" aria-hidden="true">C</span>
          <span>clipper<span class="brand-period">.</span></span>
        </a>
        <nav class="topbar-nav" aria-label="Main navigation">
          <a href="/" {% if page == 'home' %}aria-current="page"{% endif %}>Record</a>
          <a href="/dashboard" {% if page == 'dashboard' %}aria-current="page"{% endif %}>Library</a>
        </nav>
        <button class="btn btn-ghost theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">
          <svg class="theme-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span data-theme-label>Dark mode</span>
        </button>
      </header>
      <main class="main-content">
        {% block content %}{% endblock %}
      </main>
      <footer class="footer-note"><span>Made for the moments worth keeping.</span><span>Record responsibly.</span></footer>
    </div>
  </body>
</html>
