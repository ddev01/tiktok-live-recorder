{% extends "base.html" %}
{% block title %}Vodder{% endblock %}
{% block content %}
<div class="mx-auto w-full max-w-[32.5rem] text-center ">
  <div class="mb-3 inline-flex rounded-[10px] border border-[#d7dee4] p-0.5 dark:border-[#242728]" role="group" aria-label="Platform">
    <button
      class="min-h-8 rounded-md px-3 text-xs font-medium text-[#0f1011] aria-pressed:bg-[#57c1ff] dark:text-[#f4f4f6]"
      type="button"
      data-platform="tiktok"
      aria-pressed="true"
    >TikTok</button>
    <button
      class="min-h-8 rounded-md px-3 text-xs font-medium text-[#0f1011] aria-pressed:bg-[#57c1ff] dark:text-[#f4f4f6]"
      type="button"
      data-platform="twitch"
      aria-pressed="false"
    >Twitch</button>
  </div>
  <form class="relative w-full" data-search-form>
    <label class="sr-only" for="creator-search">Username or URL</label>
    <div class="relative w-full">
      <span
        class="pointer-events-none absolute top-1/2 left-3.5 z-[1] flex -translate-y-1/2 text-[#5c6672] dark:text-[#9c9c9d]"
        aria-hidden="true"
      >
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/>
          <path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </span>
      <input
        id="creator-search"
        class="h-[50px] w-full rounded-[10px] border border-[#d7dee4] bg-[#f0f3f7] pr-[4.5rem] pl-[38px] text-[15px] text-[#0f1011] outline-none transition-[border-color] duration-150 placeholder:text-[#5c6672] focus:border-black/25 focus-visible:ring-2 focus-visible:ring-[#57c1ff]/40 focus-visible:outline-none dark:border-[#242728] dark:bg-[#101111] dark:text-[#f4f4f6] dark:placeholder:text-[#9c9c9d] dark:focus:border-white/22"
        name="query"
        type="text"
        enterkeyhint="go"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        placeholder="@user or url"
        role="combobox"
        aria-autocomplete="list"
        aria-expanded="false"
        aria-haspopup="listbox"
        aria-keyshortcuts="Meta+K Control+K"
        aria-controls="search-suggestions"
        data-search-input
      >
      <div class="absolute top-1/2 right-[7px] z-[1] flex -translate-y-1/2 items-center gap-1.5">
        <span
          class="hidden min-[420px]:inline-flex items-center rounded border border-[#c8cfd8] bg-[#e4e8ed] px-[5px] py-[2px] text-[10px] font-medium leading-none text-[#3d4550] dark:border-[#3d4248] dark:bg-[#222427] dark:text-[#e2e4e8]"
          data-mod-key
          aria-hidden="true"
        >⌘ K</span>
      </div>
      <div
        id="search-suggestions"
        class="suggestions rounded-[10px] shadow-[0_12px_32px_rgb(0_0_0/0.1)] dark:shadow-[0_12px_32px_rgb(0_0_0/0.35)]"
        role="listbox"
        aria-label="Matches"
        hidden
        data-suggestions
      ></div>
    </div>
  </form>
  <div
    class="feedback mt-3 w-full text-left"
    role="status"
    aria-live="polite"
    hidden
    data-home-feedback
  ></div>
  <div class="mt-3 w-full text-left" hidden data-offline-actions>
    <p class="mb-2 text-[0.8125rem] font-medium text-[#8a949f] dark:text-[#9c9c9d]">Offline</p>
    <div class="flex flex-wrap gap-2">
      <button
        class="min-h-8 rounded-md border border-[#57c1ff] bg-[#57c1ff] px-3 text-xs font-medium text-[#0f1011] disabled:opacity-55"
        type="button"
        data-watch-mode="once"
      >Next live</button>
      <button
        class="min-h-8 rounded-md border border-[#d7dee4] bg-transparent px-3 text-xs font-medium text-[#0f1011] dark:border-[#242728] dark:text-[#f4f4f6]"
        type="button"
        data-watch-mode="always"
      >Watch</button>
    </div>
  </div>
</div>
{% endblock %}
